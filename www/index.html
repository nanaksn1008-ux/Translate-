<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPGM Translator</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#14161c;color:#e8e8ee}
h1{font-size:20px;margin:0 0 4px}
p.s{color:#9aa;font-size:13px;margin:0 0 14px}
label{display:block;font-size:13px;margin:12px 0 4px;color:#bcd}
select,input[type=file]{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1f2230;color:#fff;box-sizing:border-box}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:16px;font-weight:600}
button.dl{background:#2f9e6b}
button:disabled{opacity:.45}
progress{width:100%;height:14px}
#pct{margin-top:14px;font-size:22px;font-weight:700}
#sub{font-size:12px;color:#9aa;margin-bottom:4px}
#log{margin-top:12px;font:12px/1.5 monospace;white-space:pre-wrap;background:#0d0f14;padding:10px;border-radius:8px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<h1>RPGM Translator</h1>
<p class="s">Terjemahkan file JSON game RPG Maker MV/MZ (folder <b>www/data</b> atau <b>data</b>).</p>

<label>Bahasa asal</label>
<select id="sl"><option value="auto">Otomatis</option><option value="ja">Jepang</option><option value="en">Inggris</option><option value="zh-CN">Mandarin</option><option value="ko">Korea</option></select>

<label>Bahasa tujuan</label>
<select id="tl"><option value="id">Indonesia</option><option value="en">Inggris</option></select>

<label>Pilih file JSON (bisa banyak: Map001.json, Items.json, System.json, dst.)</label>
<input type="file" id="files" multiple accept=".json,application/json">

<button id="go">1. Mulai Terjemahkan</button>
<button id="dl" class="dl" disabled>2. Unduh Hasil (belum ada)</button>

<div id="pct">0%</div>
<div id="sub">Menunggu</div>
<progress id="bar" value="0" max="100"></progress>
<div id="log">Siap.</div>

<script>
const $=id=>document.getElementById(id);
const logEl=$('log');
const lines=[];
const log=m=>{lines.push(m);if(lines.length>40)lines.shift();logEl.textContent=lines.join('\n');logEl.scrollTop=logEl.scrollHeight};
const results=new Map(); // nama file -> teks JSON hasil terjemahan
const FOLDER='rpgmtranslate';

const CC=/\\[A-Za-z]+\[\d*\]|\\[.!|<>^{}$]|\\[A-Za-z]|%\d+/g;
const DB=/^(Actors|Classes|Items|Weapons|Armors|Skills|States|Enemies)$/;
const DBKEYS=new Set(['name','description','message1','message2','message3','message4','nickname','profile']);
const cache=new Map();

/* ---------- simpan ke Download/rpgmtranslate lewat plugin native ---------- */
function callSave(opts){
  const C=window.Capacitor;
  if(!C)return Promise.reject(new Error('Capacitor tidak terdeteksi (bukan di dalam APK)'));
  if(C.nativePromise)return C.nativePromise('DownloadSaver','save',opts);
  if(C.Plugins&&C.Plugins.DownloadSaver)return C.Plugins.DownloadSaver.save(opts);
  if(C.registerPlugin)return C.registerPlugin('DownloadSaver').save(opts);
  return Promise.reject(new Error('jembatan Capacitor tidak punya nativePromise'));
}
async function save(name,text){
  const r=await callSave({name,data:text,folder:FOLDER});
  return (r&&r.path)||('Download/'+FOLDER+'/'+name);
}

/* ---------- penerjemahan ---------- */
function protect(s){const m=[];const t=s.replace(CC,x=>{m.push(x);return '\u27e6'+(m.length-1)+'\u27e7'});return {t,m}}
function restore(t,m){
  let n=0;
  const r=t.replace(/\u27e6\s*(\d+)\s*\u27e7/g,(a,i)=>{n++;return m[i]??''});
  return n===m.length?r:null;
}
async function gt(text,sl,tl){
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(text);
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(url);
      const d=await r.json();
      return d[0].map(x=>x[0]).join('');
    }catch(e){await new Promise(r=>setTimeout(r,800*(i+1)))}
  }
  return null;
}

let inflight=0;const waitQ=[];
function limited(fn){
  return new Promise((res,rej)=>{
    const go=()=>{inflight++;fn().then(res,rej).finally(()=>{inflight--;if(waitQ.length)waitQ.shift()()})};
    if(inflight<8)go();else waitQ.push(go);
  });
}
let batchOK=true,batchFail=0;
async function gtBatch(texts,sl,tl){
  const body=new URLSearchParams();
  texts.forEach(t=>body.append('q',t));
  const url='https://translate.googleapis.com/translate_a/t?client=gtx&format=text&sl='+sl+'&tl='+tl;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});
  let d=await r.json();
  if(typeof d==='string'&&texts.length===1)d=[d];
  if(!Array.isArray(d)||d.length!==texts.length)return null;
  const out=d.map(x=>Array.isArray(x)?x[0]:x);
  return out.every(x=>typeof x==='string')?out:null;
}
async function translateBatch(items,sl,tl){
  let outs=null;
  if(batchOK){
    try{outs=await limited(()=>gtBatch(items.map(i=>i.t),sl,tl))}catch(e){outs=null}
    if(outs)batchFail=0;
    else if(++batchFail>=3){batchOK=false;log('Mode cepat tidak didukung, pakai mode satuan')}
  }
  if(!outs)outs=await Promise.all(items.map(i=>limited(()=>gt(i.t,sl,tl))));
  items.forEach((i,x)=>{
    const o=outs[x];let res=i.s;
    if(o){const r=restore(o,i.m);if(r!==null)res=r}
    cache.set(sl+tl+i.s,res);
  });
}
async function translateRefs(refs,sl,tl,onFrac){
  const seen=new Set(),items=[];
  for(const [o,k] of refs){
    const s=o[k];
    if(typeof s!=='string')continue;
    const key=sl+tl+s;
    if(cache.has(key)||seen.has(s))continue;
    seen.add(s);
    if(!/\p{L}/u.test(s.replace(CC,''))){cache.set(key,s);continue}
    const {t,m}=protect(s);
    items.push({s,t,m});
  }
  const batches=[];let cur=[],len=0;
  for(const it of items){
    if(cur.length&&(cur.length>=30||len+it.t.length>2500)){batches.push(cur);cur=[];len=0}
    cur.push(it);len+=it.t.length;
  }
  if(cur.length)batches.push(cur);
  let done=0;
  onFrac(batches.length?0:1);
  await Promise.all(batches.map(async b=>{await translateBatch(b,sl,tl);done++;onFrac(done/batches.length)}));
  for(const [o,k] of refs){
    const s=o[k];
    if(typeof s!=='string')continue;
    const r=cache.get(sl+tl+s);
    if(r!==undefined)o[k]=r;
  }
}

function collect(node,out,keys){
  if(Array.isArray(node)){node.forEach(n=>collect(n,out,keys));return}
  if(!node||typeof node!=='object')return;
  if(typeof node.code==='number'&&Array.isArray(node.parameters)){
    const p=node.parameters;
    if((node.code===401||node.code===405)&&typeof p[0]==='string')out.push([p,0]);
    else if(node.code===402&&typeof p[1]==='string')out.push([p,1]);
    else if(node.code===102&&Array.isArray(p[0]))p[0].forEach((v,i)=>{if(typeof v==='string')out.push([p[0],i])});
    return;
  }
  for(const k in node){
    const v=node[k];
    if(typeof v==='string'){if(keys.has(k))out.push([node,k])}
    else if(v&&typeof v==='object')collect(v,out,keys);
  }
}
function collectAllStrings(node,out){
  if(Array.isArray(node))node.forEach((v,i)=>typeof v==='string'?out.push([node,i]):collectAllStrings(v,out));
  else if(node&&typeof node==='object')for(const k in node){const v=node[k];typeof v==='string'?out.push([node,k]):collectAllStrings(v,out)}
}
function gather(base,data){
  const out=[];
  if(DB.test(base))collect(data,out,DBKEYS);
  else if(base==='System'){
    for(const k of ['gameTitle','currencyUnit'])if(typeof data[k]==='string')out.push([data,k]);
    if(data.terms)collectAllStrings(data.terms,out);
  }else collect(data,out,new Set(['displayName']));
  return out;
}
async function pool(items,n,fn){
  let i=0;
  await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const j=i++;await fn(items[j],j)}}));
}

/* ---------- tampilan ---------- */
function setProgress(fi,total,frac,name){
  const p=(fi+frac)/total*100;
  $('bar').value=p;
  $('pct').textContent=p.toFixed(1)+'%';
  $('sub').textContent='File '+(fi+1)+' dari '+total+' · '+name+' ('+Math.round(frac*100)+'%)';
}
function refreshDl(){
  const n=results.size;
  $('dl').disabled=n===0;
  $('dl').textContent=n?('2. Unduh Hasil ('+n+' file) → Download/'+FOLDER):'2. Unduh Hasil (belum ada)';
}

$('go').onclick=async()=>{
  const files=[...$('files').files];
  if(!files.length){log('Pilih file JSON dulu.');return}
  const sl=$('sl').value,tl=$('tl').value;
  $('go').disabled=true;$('dl').disabled=true;
  results.clear();
  try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}
  const t0=Date.now();
  const prog=new Array(files.length).fill(0);
  let finished=0,bad=0;
  const upd=()=>{
    const p=prog.reduce((a,b)=>a+b,0)/files.length*100;
    $('bar').value=p;
    $('pct').textContent=p.toFixed(1)+'%';
    const el=(Date.now()-t0)/1000;
    let eta='';
    if(p>1.5){const rem=el/p*(100-p);eta=' · sisa ±'+(rem>=90?Math.round(rem/60)+' mnt':Math.round(rem)+' dtk')}
    $('sub').textContent=finished+' dari '+files.length+' file selesai'+eta+' · '+(batchOK?'mode cepat':'mode satuan');
  };
  upd();
  await pool(files.map((_,i)=>i),3,async fi=>{
    const f=files[fi];
    const base=f.name.replace(/\.json$/i,'');
    try{
      const data=JSON.parse(await f.text());
      const refs=gather(base,data);
      await translateRefs(refs,sl,tl,fr=>{prog[fi]=fr*0.98;upd()});
      results.set(f.name,JSON.stringify(data));
      log('OK  '+f.name+' ('+refs.length+' teks)');
    }catch(e){bad++;log('GAGAL '+f.name+': '+e.message)}
    prog[fi]=1;finished++;upd();
  });
  const mins=((Date.now()-t0)/60000).toFixed(1);
  $('bar').value=100;$('pct').textContent='100%';
  $('sub').textContent='Terjemahan selesai ('+mins+' menit): '+results.size+' file siap'+(bad?(', '+bad+' gagal'):'');
  log('\nSelesai. Tekan tombol hijau "Unduh Hasil".');
  refreshDl();
  $('go').disabled=false;
};

$('dl').onclick=async()=>{
  const names=[...results.keys()];
  if(!names.length)return;
  $('go').disabled=true;$('dl').disabled=true;
  let ok=0,bad=0,lastErr='';
  for(let i=0;i<names.length;i++){
    const n=names[i];
    $('bar').value=(i/names.length)*100;
    $('pct').textContent=Math.round(i/names.length*100)+'%';
    $('sub').textContent='Menyimpan '+(i+1)+' dari '+names.length+' · '+n;
    try{await save(n,results.get(n));results.delete(n);ok++}
    catch(e){bad++;lastErr=e.message||String(e);log('GAGAL simpan '+n+': '+lastErr)}
  }
  $('bar').value=100;$('pct').textContent='100%';
  $('sub').textContent=ok+' file tersimpan di Download/'+FOLDER+(bad?(' · '+bad+' gagal'):'');
  log('\n'+ok+' file tersimpan di Download/'+FOLDER+(bad?('\n'+bad+' gagal, tekan Unduh lagi. Error: '+lastErr):''));
  refreshDl();
  $('go').disabled=false;
};

log('Capacitor: '+(window.Capacitor?'ada':'TIDAK ADA')+' · jembatan native: '+((window.Capacitor&&window.Capacitor.nativePromise)?'ada':'tidak'));
</script>
</body>
</html>
